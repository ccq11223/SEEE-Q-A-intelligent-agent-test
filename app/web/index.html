<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<title>课程答疑</title>
<link rel="stylesheet" href="/static/katex/katex.min.css?v=20261019a">
<style>
  :root {
    --ink: #1c2430;
    --muted: #6b7684;
    --line: #e3e8ef;
    --bg: #f5f7fa;
    --brand: #1f4e79;
    --brand-soft: #e8f0f8;
    --warn: #a15c00;
    --warn-soft: #fff4e0;
    --gray: #55606e;
    --gray-soft: #eef1f5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 720px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: #fff;
    box-shadow: 0 0 24px rgba(20, 30, 50, .06);
  }
  header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--line);
    background: #fff;
  }
  h1 { margin: 0 0 4px; font-size: 17px; letter-spacing: .2px; }
  .intro { margin: 0; color: var(--muted); font-size: 13px; white-space: pre-line; }
  .who { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .who label { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .who input {
    flex: 1; min-width: 0;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font: inherit; font-size: 13px;
    background: #fbfcfe;
  }
  .who button {
    padding: 7px 10px;
    border: 1px solid var(--line);
    background: #fff; color: var(--muted);
    border-radius: 8px; font: inherit; font-size: 12px;
    cursor: pointer; white-space: nowrap;
  }
  .who button:hover { border-color: var(--brand); color: var(--brand); }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  .msg { display: flex; flex-direction: column; max-width: 92%; }
  .msg.me { align-self: flex-end; align-items: flex-end; }
  .msg.bot { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 13px;
    border-radius: 12px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .me .bubble { background: var(--brand); color: #fff; border-bottom-right-radius: 4px; }
  .bot .bubble { background: var(--bg); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .bot.handoff .bubble { background: var(--warn-soft); border-color: #f0d9b0; color: #5c3a00; }
  .bot.web .bubble { background: #fffaf0; border-color: #f0d9b0; }
  .bot.general .bubble { background: #f8f9fb; border-color: #dfe4ea; }
  .meta { margin-top: 5px; font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .meta a { color: var(--brand); text-decoration: none; }
  .meta a:hover { text-decoration: underline; }
  .tag {
    display: inline-block; padding: 1px 7px; border-radius: 999px;
    background: var(--brand-soft); color: var(--brand); font-size: 11px;
  }
  .tag.handoff { background: #f6e3c1; color: var(--warn); }
  .tag.web { background: #fdf0d5; color: #8a5a00; }
  .tag.general { background: var(--gray-soft); color: var(--gray); }
  .typing { color: var(--muted); font-size: 13px; }
  footer {
    border-top: 1px solid var(--line);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: #fff;
  }
  .composer { display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1;
    min-height: 42px; max-height: 132px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font: inherit; resize: none;
    background: #fbfcfe;
  }
  textarea:focus, .who input:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }
  #send {
    padding: 0 16px; height: 42px;
    border: none; border-radius: 10px;
    background: var(--brand); color: #fff;
    font: inherit; cursor: pointer;
  }
  #send:disabled { background: #b8c4d2; cursor: default; }
  .hint { margin: 8px 2px 0; font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }
  .error { color: #b3261e; font-size: 13px; margin-top: 8px; display: none; }
  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .actions button {
    padding: 7px 12px; border: none; border-radius: 8px;
    background: var(--brand); color: #fff; font: inherit; font-size: 13px; cursor: pointer;
  }
  .actions button.ghost { background: #fff; color: var(--muted); border: 1px solid var(--line); }

  /* AI 回答的富文本：标题、列表、公式、表格、引用的课件图片 */
  .bot .bubble > :first-child { margin-top: 0; }
  .bot .bubble > :last-child { margin-bottom: 0; }
  .bot .bubble h1, .bot .bubble h2, .bot .bubble h3 {
    font-size: 15px; margin: 12px 0 6px; line-height: 1.4;
  }
  .bot .bubble p { margin: 6px 0; }
  .bot .bubble ul, .bot .bubble ol { margin: 6px 0; padding-left: 20px; }
  .bot .bubble li { margin: 3px 0; }
  .bot .bubble blockquote {
    margin: 8px 0; padding: 6px 10px;
    border-left: 3px solid var(--brand);
    background: var(--brand-soft); color: #42526b;
  }
  .bot .bubble code { background: #eef1f5; padding: 1px 5px; border-radius: 4px; font-family: Consolas, monospace; font-size: 13px; }
  .bot .bubble pre { background: #f0f2f5; padding: 9px 11px; border-radius: 8px; overflow-x: auto; }
  .bot .bubble pre code { background: transparent; padding: 0; }
  .bot .bubble table { border-collapse: collapse; margin: 8px 0; width: 100%; }
  .bot .bubble th, .bot .bubble td { border: 1px solid var(--line); padding: 5px 8px; font-size: 13px; }
  .katex-display { overflow-x: auto; overflow-y: hidden; }
  .figs { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
  .fig { margin: 10px 0; }
  .fig:last-child { margin-bottom: 2px; }
  .fig img {
    max-width: 100%; border: 1px solid var(--line);
    border-left: 3px solid #9a7fd1; border-radius: 8px; background: #fff;
  }
  .fig figcaption { font-size: 12px; color: var(--muted); margin-top: 3px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="title">课程答疑</h1>
    <p class="intro" id="intro"></p>
    <div class="who">
      <label for="anon">匿名代号</label>
      <input id="anon" maxlength="16" placeholder="例如 xh-2026-07" autocomplete="off">
      <button id="random" type="button">随机</button>
    </div>
  </header>

  <main id="chat"></main>

  <footer>
    <div class="composer">
      <textarea id="q" rows="1" placeholder="输入你的问题"></textarea>
      <button id="send" type="button">发送</button>
    </div>
    <div class="hint">
      <span id="disclaimer"></span>
      <span><span id="count">0</span>/<span id="limit">300</span></span>
    </div>
    <div class="error" id="error"></div>
  </footer>
</div>

<script src="/static/katex/katex.min.js?v=20261019a"></script>
<script src="/static/marked.min.js?v=20261019a"></script>
<script src="/static/purify.min.js?v=20261019a"></script>
<script src="/static/render.js?v=20261019a"></script>
<script>
const $ = (id) => document.getElementById(id);
const chat = $('chat');
let config = { max_question_chars: 300 };
let busy = false;
// 只在浏览器里保留最近几轮，服务端不存；刷新页面即清空
let history = [];
// 基础测评状态与测评得出的学习水平
let assessment = null;
let learner = null;
let pendingQuestion = '';
try {
  learner = JSON.parse(localStorage.getItem('learner') || 'null');
} catch (err) {
  learner = null;
}

fetch('/api/config').then(r => r.json()).then(c => {
  config = c;
  document.title = c.title;
  $('title').textContent = c.title;
  $('intro').textContent = c.intro;
  $('disclaimer').textContent = c.disclaimer;
  $('q').placeholder = c.placeholder || '输入你的问题';
  $('limit').textContent = c.max_question_chars;
}).catch(() => {});

$('anon').value = localStorage.getItem('anon_code') || '';
$('anon').addEventListener('input', () => {
  localStorage.setItem('anon_code', $('anon').value.trim());
});

$('random').addEventListener('click', () => {
  const code = 'xh-' + Math.random().toString(36).slice(2, 8);
  $('anon').value = code;
  localStorage.setItem('anon_code', code);
});

if (!learner && !localStorage.getItem('assess_skipped')) {
  addAssessmentCard();
}

function addMessage(text, who, meta) {
  const box = document.createElement('div');
  box.className = 'msg ' + who;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (who === 'bot') {
    bubble.innerHTML = window.renderRich(text);
  } else {
    bubble.textContent = text;
  }
  box.appendChild(bubble);
  if (who === 'bot' && meta && meta.images && meta.images.length) {
    window.insertPageImages(bubble, meta.images);
  }
  if (meta) {
    const m = document.createElement('div');
    m.className = 'meta';
    if (meta.tag) {
      const tag = document.createElement('span');
      tag.className = 'tag ' + (meta.level || '');
      tag.textContent = meta.tag;
      m.appendChild(tag);
    }
    if (meta.detail) {
      const detail = document.createElement('span');
      detail.textContent = meta.detail;
      m.appendChild(detail);
    }
    (meta.sources || []).forEach((url, index) => {
      const link = document.createElement('a');
      link.href = url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = '来源' + (index + 1);
      m.appendChild(link);
    });
    box.appendChild(m);
  }
  chat.appendChild(box);
  chat.scrollTop = chat.scrollHeight;
  return box;
}

function addAssessmentCard() {
  const box = document.createElement('div');
  box.className = 'msg bot';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML =
    '<p>我是这门课的答疑助手。正式答疑前，建议先做 <strong>5 道基础概念题</strong>' +
    '（约 2 分钟）。我会根据你的掌握情况调整讲解深浅，答错不计成绩。</p>';
  const actions = document.createElement('div');
  actions.className = 'actions';
  const start = document.createElement('button');
  start.type = 'button';
  start.textContent = '开始 5 题测评';
  start.addEventListener('click', () => {
    box.remove();
    beginAssessment();
  });
  const skip = document.createElement('button');
  skip.type = 'button';
  skip.className = 'ghost';
  skip.textContent = '跳过，直接提问';
  skip.addEventListener('click', () => {
    box.remove();
    localStorage.setItem('assess_skipped', '1');
    addMessage('好的，直接开始答疑。有问题随时问。', 'bot');
  });
  actions.appendChild(start);
  actions.appendChild(skip);
  bubble.appendChild(actions);
  box.appendChild(bubble);
  chat.appendChild(box);
  chat.scrollTop = chat.scrollHeight;
}

async function beginAssessment() {
  const anon = $('anon').value.trim();
  if (!/^[A-Za-z0-9_\-]{2,16}$/.test(anon)) {
    showError('请先填匿名代号（2-16 位字母、数字、下划线或连字符）');
    $('anon').focus();
    return false;
  }
  busy = true;
  $('send').disabled = true;
  showError('');
  try {
    const resp = await fetch('/api/assess/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ anon_code: anon })
    });
    const data = await resp.json();
    if (!resp.ok) {
      showError(data.detail || '测评启动失败，请稍后再试');
      return false;
    }
    assessment = { active: true, index: 1, total: data.total };
    addMessage(data.intro, 'bot', { level: 'kb', tag: '基础测评' });
    addMessage(
      `第 1/${data.total} 题：${data.question.question}`,
      'bot',
      {
        level: 'kb',
        tag: [data.question.type_label, data.question.chapter].filter(Boolean).join(' · ') || '基础概念'
      }
    );
    return true;
  } catch (err) {
    showError('网络好像不太行，请稍后重试');
    return false;
  } finally {
    busy = false;
    $('send').disabled = false;
    $('q').focus();
  }
}

function handleAssessmentAnswer(data) {
  const verdict = data.score === 1 ? '答对了' : (data.score === 0.5 ? '部分正确' : '这题还没答对');
  addMessage(
    `${verdict}（${data.score} 分）。${data.feedback || ''}`,
    'bot',
    { level: data.score >= 0.5 ? 'kb' : 'general', tag: `第 ${data.index}/${data.total} 题` }
  );

  if (data.next) {
    addMessage(
      `第 ${data.next.index}/${data.next.total} 题：${data.next.question}`,
      'bot',
      {
        level: 'kb',
        tag: [data.next.type_label, data.next.chapter].filter(Boolean).join(' · ') || '基础概念'
      }
    );
    return;
  }

  const summary = data.summary || {};
  const report = summary.report_text || [
    summary.disclaimer || '',
    '',
    `【成绩】${summary.score} / ${summary.max_score}（${summary.level_label || ''}）`,
    `【答对】${(summary.correct_ids || []).join('、') || '无'}`,
    `【答错】${(summary.wrong_ids || []).join('、') || '无'}`,
    `【薄弱章节】${(summary.weak_chapters || []).join('；') || '无'}`,
    `【优先复习】${(summary.review_points || []).join('；') || '无'}`,
    `【给辅导学长】${summary.tutor_note || ''}`
  ].join('\n');
  const box = addMessage(report, 'bot', { level: 'kb', tag: '诊断报告' });
  const actions = document.createElement('div');
  actions.className = 'actions';
  const copy = document.createElement('button');
  copy.type = 'button';
  copy.textContent = '复制诊断报告';
  copy.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(report);
      copy.textContent = '已复制，可发给辅导学长';
    } catch (err) {
      copy.textContent = '复制失败，请手动选中文字';
    }
  });
  actions.appendChild(copy);
  box.appendChild(actions);
  addMessage('后面的讲解会按这个水平调整，可以随时继续追问。', 'bot');
  learner = {
    level: summary.level || '',
    weak_points: summary.weak_point_list || []
  };
  localStorage.setItem('learner', JSON.stringify(learner));
  assessment = null;

  if (pendingQuestion) {
    const question = pendingQuestion;
    pendingQuestion = '';
    $('q').value = question;
    $('count').textContent = String(question.length);
    resize();
    setTimeout(send, 200);
  }
}

function showError(text) {
  const el = $('error');
  el.textContent = text;
  el.style.display = text ? 'block' : 'none';
}

function resize() {
  const el = $('q');
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 132) + 'px';
}

$('q').addEventListener('input', () => {
  $('count').textContent = $('q').value.length;
  resize();
});

$('q').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

$('send').addEventListener('click', send);

async function send() {
  if (busy) return;
  const question = $('q').value.trim();
  const anon = $('anon').value.trim();
  showError('');

  if (!question) { showError('先写一个问题吧'); return; }
  if (!/^[A-Za-z0-9_\-]{2,16}$/.test(anon)) {
    showError('请先填匿名代号（2-16 位字母、数字、下划线或连字符）');
    $('anon').focus();
    return;
  }
  if (question.length > config.max_question_chars) {
    showError('问题太长了，请分几次问');
    return;
  }

  // 还没测评也没跳过：先做测评，刚才的问题记下来，测评完自动接着回答
  if (!assessment && !learner && !localStorage.getItem('assess_skipped')) {
    pendingQuestion = question;
    $('q').value = '';
    $('count').textContent = '0';
    resize();
    await beginAssessment();
    return;
  }

  addMessage(question, 'me');
  $('q').value = '';
  $('count').textContent = '0';
  resize();

  const pending = addMessage('思考中…', 'bot');
  pending.querySelector('.bubble').classList.add('typing');
  busy = true;
  $('send').disabled = true;

  try {
    const answeringAssessment = Boolean(assessment && assessment.active);
    const endpoint = answeringAssessment ? '/api/assess/answer' : '/api/ask';
    const body = answeringAssessment
      ? { anon_code: anon, answer: question }
      : {
          anon_code: anon,
          question: question,
          history: history.slice(-6),
          level: learner ? learner.level : '',
          weak_points: learner ? (learner.weak_points || []) : []
        };
    const resp = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await resp.json();
    pending.remove();

    if (!resp.ok) {
      if (answeringAssessment && resp.status === 400) {
        // 服务重启后内存里的测评状态会丢，让页面回到可重开的状态
        assessment = null;
        showError('测评状态已失效，请刷新页面重新开始');
      } else {
        showError(data.detail || '请求失败，请稍后再试');
      }
      return;
    }

    if (answeringAssessment) {
      handleAssessmentAnswer(data);
      return;
    }

    history.push({ role: 'user', content: question });
    history.push({ role: 'assistant', content: (data.answer || '').slice(0, 1200) });
    if (history.length > 8) history = history.slice(-8);

    const level = data.source_level || data.mode || 'kb';
    const labelMap = {
      kb: '依据课件',
      web: '网络搜索·未审核',
      general: '课件未覆盖·通用知识',
      handoff: '需人工确认'
    };
    const pages = data.citations && data.citations.length
      ? '第 ' + data.citations.join('、') + ' 页' : '';
    const detail = [pages, (data.latency_ms / 1000).toFixed(1) + ' 秒']
      .filter(Boolean).join(' · ');
    const box = addMessage(data.answer, 'bot', {
      level: level,
      tag: data.source_label || labelMap[level] || '',
      detail: detail,
      sources: data.sources || [],
      images: data.images || []
    });
    box.classList.add(level);
  } catch (err) {
    pending.remove();
    showError('网络好像不太行，请稍后重试');
  } finally {
    busy = false;
    $('send').disabled = false;
    $('q').focus();
  }
}
</script>
</body>
</html>
