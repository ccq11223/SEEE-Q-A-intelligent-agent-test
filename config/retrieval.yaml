# 检索与「有没有依据」的判定参数（方案 §4.2 决策链的 ①② 步）

retrieve_top_k: 20      # 向量召回条数
rerank_top_k: 6         # 交给模型的条数（重排接入后生效）
min_score: 0.35         # 最高相关度低于该值 → 判定「知识库没覆盖」
# 重排（交叉编码器）参数。启用后「有没有依据」以重排分数为准——
# 向量分数只能说明话题相邻，重排分数才能说明这段内容真能回答问题。
rerank_top_n: 8         # 对向量召回的前 N 条做重排
min_rerank_score: 0.5   # 重排分数低于此值判定为「资料没覆盖」，走转人工
require_citation: true  # 回答必须带页码引用，否则视为「不合格回答」重新生成
allow_web: true         # 课件没覆盖时是否联网兜底
allow_general: true     # 联网也没有时，是否允许用通用知识作答（必须明确标注）
max_context_chars: 8000 # 拼进提示词的原文上限（方法类问题常常跨好几页）
max_trust_level: 2      # 允许引用的最高级别（1=权威 2=需标注 3=待确认，3 不直接引用）

# 非课件来源的标注文案。**必须让学生一眼看出这不是课件依据**——
# 这是「能答上来」与「不会把 AI 猜的当成老师讲的」之间的平衡点。
external:
  web_note: 【网络搜索结果·未经审核，请与课件核对】
  general_note: 【课件未覆盖·以下为通用知识解答，仅供参考】

# 命中这些模式的问题直接转人工，不进生成环节。
# 阶段 2 试运行后把这里清空：学生问「证明一下」「整章梳理」正是最需要 AI 的地方，
# 拦下来等于拒答。现在只有「模型故障」才会转人工；这个开关保留给将来真需要时用。
handoff_patterns: []
