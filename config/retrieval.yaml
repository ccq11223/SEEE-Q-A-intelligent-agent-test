# 检索与「有没有依据」的判定参数（方案 §4.2 决策链的 ①② 步）

retrieve_top_k: 20      # 向量召回条数
rerank_top_k: 5         # 交给模型的条数（重排接入后生效）
min_score: 0.35         # 最高相关度低于该值 → 判定「知识库没覆盖」
require_citation: true  # 回答必须带页码引用，否则视为「不合格回答」重新生成
allow_web: false        # 无依据时是否允许联网兜底（阶段 2 再打开；默认关闭，一律转人工）
max_context_chars: 6000 # 拼进提示词的原文上限
max_trust_level: 2      # 允许引用的最高级别（1=权威 2=需标注 3=待确认，3 不直接引用）

# 命中这些模式的问题直接转人工，不进生成环节（复杂综合题拦截）
handoff_patterns:
  - 综合题
  - 课程设计
  - 证明
  - 推导并说明
  - 整章
