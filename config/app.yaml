# 在线服务配置（阶段 2）
# 改这里不用改代码；所有文案都在这里，方便你们调整口吻。

server:
  host: 127.0.0.1
  port: 8000
  # 试点期用 Cloudflare Tunnel 把本机端口暴露出去，不需要备案（方案 §6.2）。
  # 等要面向全年级时，再换国内轻量服务器 + 正式域名 + 备案。

limits:
  max_question_chars: 300   # 单个问题最长字数
  asks_per_hour_per_ip: 30  # 每个 IP 每小时最多提问次数（防误触/防跑飞）

copy:
  title: 电路理论 · 课程答疑
  intro: |
    我是这门课的助教，回答会尽量依据课件，并标出页码。
    资料里没讲到的内容，我会直接说明并建议你找学长学姐线下确认。
  disclaimer: AI 回答仅供复习参考，以课件和老师讲授为准；发现错误请告诉学长学姐。
  placeholder: 例如：为什么理想电流源不能开路？
  handoff_hint: 这个问题资料里没有覆盖，建议带着题目找学长学姐线下确认。
