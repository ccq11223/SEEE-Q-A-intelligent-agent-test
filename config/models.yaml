# 所有模型一律走「OpenAI 兼容」HTTP 接口。
# 换服务商只需改 base_url / name / api_key_env 三处，代码不用动。

vision:
  # 实测：该账号 176 个可用模型里没有 qwen-vl-max / -latest，
  # 含 vl 的只有 qwen3-vl-plus、qwen-vl-ocr、qwen-vl-ocr-2025-11-20。
  # qwen3-vl-plus 是通用多模态模型，公式与版式理解比纯 OCR 模型更适合本任务。
  name: qwen3-vl-plus
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: DASHSCOPE_API_KEY
  max_tokens: 4096
  temperature: 0.0
  timeout_s: 180

embedding:
  name: BAAI/bge-m3
  base_url: https://api.siliconflow.cn/v1
  api_key_env: SILICONFLOW_API_KEY
  dim: 1024
  timeout_s: 120

generate:
  # 实测：该 deepseek 账号的可用模型列表里没有 deepseek-chat，只有 v4 系列。
  # 换账号或换服务商时，先跑 python -m pipeline keys 确认模型名。
  name: deepseek-flash
  base_url: https://api.deepseek.com/v1
  api_key_env: DEEPSEEK_API_KEY
  # 这两个 v4 模型都是推理模型：会先用 thinking 把额度花掉再写答案。
  # 实测 1500 时答案会被截成空字符串（只剩 reasoning_content），所以给足额度。
  max_tokens: 4096
  # 温度设 0：答疑要求忠实于课件原文，不需要「发挥」；更重要的是，
  # 黄金测试集必须可重复——同题两次结果不同，就判断不出改动是好是坏。
  # 实测 0.2 时同一道题会出现「有时带页码引用、有时一个页码都不写」。
  temperature: 0.0
  timeout_s: 120

# 重排模型（交叉编码器）。它直接判断「这段资料能不能回答这个问题」，
# 比向量余弦准得多：向量只衡量「意思像不像」，实测会出现「话题相邻但没答案」
# 却被判为有依据的情况（二端口网络 Z 参数那道题就是）。
rerank:
  name: BAAI/bge-reranker-v2-m3
  base_url: https://api.siliconflow.cn/v1
  api_key_env: SILICONFLOW_API_KEY
  timeout_s: 60
