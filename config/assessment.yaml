# 基础诊断测评题库（首次使用时的 5 道概念题）
# 只放概念、物理意义、公式含义、适用条件类题目，不放复杂计算。
# 每题都标注课件出处，方便学生答完后回看；answer 是评分用的参考答案。

version: "2026-10-17.1"

questions:
  - id: diag-01
    chapter: 第1章 电路模型与基本定律
    doc: slide-04
    pages: [11]
    level: 1
    question: 什么情况下电路可以按集中参数电路来分析？集中参数分析默认了哪几条假设？
    answer: 当电路尺寸远小于工作频率对应的电磁波波长时，可以按集中参数处理；工程上常要求尺寸小于波长的百分之一。它默认电磁波传播时间可忽略、每个器件净电荷为零、不同器件之间不存在磁耦合。
    points:
      - 电路尺寸远小于工作波长
      - 电磁波传播时间可忽略
      - 每个器件净电荷为零
      - 不同器件之间无磁耦合

  - id: diag-02
    chapter: 第2章 电阻电路等效变换
    doc: slide-05
    pages: [9, 10, 11]
    level: 1
    question: 两个内部结构完全不同的二端电路，什么情况下可以认为它们等效？
    answer: 只要两个二端网络的端口伏安特性完全相同，它们对任何外电路的作用效果就相同，可以互相等效。内部结构是否相同不重要；只在某一个工作点上电压电流相同，不能算等效。
    points:
      - 端口伏安特性完全相同
      - 对任何外电路作用效果相同
      - 只在单个工作点相同不算等效

  - id: diag-03
    chapter: 第3章 电路方程
    doc: slide-06
    pages: [10]
    level: 2
    question: 支路分析法列方程的一般步骤是什么？
    answer: 先标定各支路电流或电压的参考方向；选 n-1 个独立结点列 KCL；再选 b-n+1 个独立回路列 KVL；最后联立求解 b 个支路电流。
    points:
      - 标定支路电流或电压的参考方向
      - 列 n-1 个 KCL 方程
      - 列 b-n+1 个 KVL 方程
      - 联立求解支路电流

  - id: diag-04
    chapter: 第3章 电路方程
    doc: slide-06
    pages: [33]
    level: 3
    question: 用结点电压法时，如果两个结点之间接的是无伴理想电压源，应该怎么处理？
    answer: 先把这个电压源支路的电流设成未知量，按常规列结点 KCL；再补充一个结点电压与电压源电压的关系式，例如 U1-U3=Us。这样方程数和未知量数仍然相等。
    points:
      - 设电压源支路电流为未知量
      - 按常规列结点 KCL
      - 增补结点电压与电压源的关系式

  - id: diag-05
    chapter: 第4章 电路定理
    doc: slide-07
    pages: [25, 26]
    level: 2
    question: 替代定理的适用条件是什么？
    answer: 原电路和替代后的电路都必须有唯一解；替代后不能出现电压源回路，也不能出现电流源节点（含广义节点）；被替代支路与电路其余部分不能有耦合；其余支路的连接和参数不能改变。
    points:
      - 替代前后都有唯一解
      - 不出现电压源回路
      - 不出现电流源节点
      - 被替代支路与其余部分无耦合
      - 其余支路连接和参数不变

  - id: diag-06
    chapter: 第4章 电路定理
    doc: slide-07
    pages: [12]
    level: 3
    question: 叠加定理能不能用来叠加功率？为什么？
    answer: 不能。功率等于电压与电流的乘积，是电路变量的二次函数，不满足线性叠加。正确做法是先把各电源单独作用时的电流分量相加得到总电流，再算总功率。
    points:
      - 功率不能叠加
      - 功率是电压和电流的乘积、是二次量
      - 应先叠加电流再算功率

  - id: diag-07
    chapter: 第4章 电路定理
    doc: slide-08
    pages: [9, 13]
    level: 2
    question: 戴维南定理说的是什么？等效电压和等效电阻分别怎么求？
    answer: 线性含源二端网络对外可以等效成一个电压源 Uoc 与电阻 Req 串联。Uoc 是端口开路电压；Req 是把网络内独立源置零后，从端口看进去的等效电阻。
    points:
      - 等效为电压源与电阻串联
      - 等效电压是开路电压
      - 等效电阻是独立源置零后的端口电阻

  - id: diag-08
    chapter: 第8章 一阶电路
    doc: slide-11
    pages: [7, 8]
    level: 1
    question: RC 电路的时间常数是什么？它反映了什么？
    answer: 时间常数等于 R 与 C 的乘积，单位是秒。它反映零输入响应衰减的快慢和过渡过程的长短：时间常数越大，衰减越慢，过渡过程越长。
    points:
      - 时间常数等于 RC
      - 反映衰减快慢和过渡过程长短
      - 单位是秒

  - id: diag-09
    chapter: 第8章 一阶电路
    doc: slide-11
    pages: [41, 42]
    level: 3
    question: 三要素法求一阶电路响应的步骤是什么？使用条件有哪些？
    answer: 先求初始值、稳态值和时间常数三个要素，再代入三要素公式写出响应。它只适用于一阶 RC 或 RL 电路，且输入信号必须是恒定值。
    points:
      - 只适用于一阶动态电路
      - 输入信号必须恒定
      - 求初始值、稳态值、时间常数
      - 代入三要素公式

  - id: diag-10
    chapter: 第10章 正弦稳态
    doc: slide-01
    pages: [9, 10]
    level: 1
    question: 两个同频率正弦量的相位差怎么算？算出来正数和负数分别说明什么？
    answer: 相位差等于两个初相位之差，例如 φ=φu-φi。φ 大于 0 说明电压超前电流，φ 小于 0 说明电流超前电压；绝对值超过 π 时先换算到 ±π 以内再判断。
    points:
      - 相位差等于初相位之差
      - 正数表示前者超前
      - 负数表示前者滞后

  - id: diag-11
    chapter: 第11章 正弦稳态功率
    doc: slide-03
    pages: [7, 11]
    level: 2
    question: 有功功率、无功功率和视在功率分别是什么？三者之间是什么关系？
    answer: 有功功率 P=UIcosφ，单位 W，是真正消耗的功率；无功功率 Q=UIsinφ，单位 var，反映与电源交换的能量；视在功率 S=UI，单位 VA，反映设备容量。三者满足 S=√(P²+Q²)。
    points:
      - 有功功率 P=UIcosφ
      - 无功功率 Q=UIsinφ
      - 视在功率 S=UI
      - S=√(P²+Q²)

  - id: diag-12
    chapter: 第11章 正弦稳态功率
    doc: slide-03
    pages: [21, 22]
    level: 3
    question: 提高感性负载的功率因数，为什么一般并联电容而不是串联电容？
    answer: 并联电容只提供容性无功，不改变负载本身的工作电压和电流，负载仍能正常工作；串联电容会改变负载端电压，可能使负载无法正常工作。功率因数提高后线路电流变小，线损也随之下降。
    points:
      - 并联不改变负载工作状态
      - 串联会改变负载端电压
      - 功率因数提高后线路电流和线损下降

  - id: diag-13
    chapter: 第12章 三相电路
    doc: slide-14
    pages: [7, 8, 11]
    level: 2
    question: 对称三相电源有哪三个特征？
    answer: 三个电源的频率相同、幅值（有效值）相同、相位互差 120°。三相的相序还分正序和负序。
    points:
      - 频率相同
      - 幅值相同
      - 相位互差 120 度

  - id: diag-14
    chapter: 第13章 耦合电感
    doc: slide-15
    pages: [8, 9]
    level: 2
    question: 同名端怎么判断？写耦合电感的电压关系时，同名端起什么作用？
    answer: 同名端是互感电压极性相同的端子，通常用星号标出。两线圈电流都从同名端流入时，互感起加强作用；写电压关系时，互感项的正负由电流是否从同名端流入决定。
    points:
      - 同名端是互感电压极性相同的端子
      - 电流都从同名端流入时互感加强
      - 互感项符号由同名端决定

  - id: diag-15
    chapter: 第14章 频率响应
    doc: slide-16
    pages: [10, 11]
    level: 3
    question: RLC 串联电路发生谐振时有哪些特点？
    answer: 谐振时端口电压与电流同相位，阻抗最小且等于 R，电流达到最大 Us/R；电感电压与电容电压大小相等、方向相反，互相抵消。
    points:
      - 电压与电流同相位
      - 阻抗最小等于 R
      - 电流最大
      - 电感电压与电容电压抵消
