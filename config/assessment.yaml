# 前置 5 题诊断题库
#
# 设计依据：《张导_智能体小思考》——
#   * 不出期末压轴大题，目的是区分「完全没听懂」「概念懂但不会做题」「部分章节薄弱」；
#   * 每次抽 2 道基础概念判断题 + 2 道基础简单计算题 + 1 道小型综合题；
#   * 顺序固定为 概念 → 计算 → 综合，方便定位问题出在哪一层。
#
# type: concept（概念判断）/ calculation（简单计算）/ comprehensive（小型综合）
# review: 答错后建议优先复习的知识点，会写进诊断报告

version: "2026-10-18.1"

questions:
  # ---------------- 概念判断 ----------------
  - id: c-01
    type: concept
    chapter: 第1章 电路模型与基本定律
    doc: slide-04
    pages: [11]
    level: 1
    question: '判断：只要电路尺寸远小于工作电磁波的波长，就可以按集中参数电路分析。这个说法对吗？集中参数分析还默认了哪些假设？'
    answer: '对。工程上通常要求电路尺寸小于波长的百分之一；同时默认电磁波传播时间可忽略、每个器件净电荷为零、不同器件之间不存在磁耦合。'
    points:
      - 电路尺寸远小于工作波长
      - 电磁波传播时间可忽略
      - 每个器件净电荷为零
      - 不同器件之间无磁耦合
    review: 集中参数电路的适用条件与三条默认假设

  - id: c-02
    type: concept
    chapter: 第2章 电阻电路等效变换
    doc: slide-05
    pages: [9, 10, 11]
    level: 1
    question: '判断：两个二端网络只要端口伏安特性完全相同，就可以互相等效，不管内部结构是否一样。这个说法对吗？'
    answer: '对。等效看的是端口外特性，不看内部结构；对连接在端口上的任何外电路作用效果相同即可。只在某一个工作点上电压电流相同，不能算等效。'
    points:
      - 端口伏安特性完全相同
      - 等效与内部结构无关
      - 单个工作点相同不算等效
    review: 二端网络等效的判定标准

  - id: c-03
    type: concept
    chapter: 第4章 电路定理
    doc: slide-07
    pages: [12]
    level: 2
    question: '判断：叠加定理不仅可以叠加电压和电流，也可以直接叠加功率。这个说法对吗？为什么？'
    answer: '错。功率等于电压与电流的乘积，是电路变量的二次函数，不满足线性叠加。正确做法是先叠加电流（或电压），再算功率。'
    points:
      - 功率不能直接叠加
      - 功率是电压和电流的乘积、是二次量
      - 应先叠加电流再算功率
    review: 叠加定理的适用范围（电压、电流可叠加，功率不可）

  - id: c-04
    type: concept
    chapter: 第8章 一阶电路
    doc: slide-11
    pages: [7, 8]
    level: 2
    question: '判断：一阶电路的时间常数越大，过渡过程结束得越快。这个说法对吗？'
    answer: '错。时间常数 τ=RC（或 L/R）越大，零输入响应衰减越慢，过渡过程持续越久；τ 越小才越快。'
    points:
      - 时间常数越大过渡越慢
      - τ=RC 或 L/R
      - 反映衰减快慢
    review: 时间常数的物理意义

  - id: c-05
    type: concept
    chapter: 第14章 频率响应
    doc: slide-16
    pages: [10, 11]
    level: 2
    question: '判断：RLC 串联电路发生谐振时，阻抗最小、电流最大。这个说法对吗？'
    answer: '对。谐振时感抗与容抗相互抵消，阻抗等于电阻 R，达到最小；在电源电压一定时电流达到最大 Us/R，且电压与电流同相位。'
    points:
      - 谐振时阻抗最小等于 R
      - 电流最大
      - 电压与电流同相位
    review: RLC 串联谐振的特点

  - id: c-06
    type: concept
    chapter: 第3章 电路方程
    doc: slide-06
    pages: [21, 22]
    level: 2
    question: '判断：用结点电压法时，参考结点一旦选定，各结点电压就是该结点与参考结点之间的电压降。这个说法对吗？'
    answer: '对。结点电压定义为独立结点相对参考结点的电压降，参考结点电位取 0；方向由独立结点指向参考结点。'
    points:
      - 结点电压是相对参考结点的电压降
      - 参考结点电位取 0
      - 方向由独立结点指向参考结点
    review: 结点电压的定义与参考结点的选择

  # ---------------- 基础简单计算 ----------------
  - id: k-01
    type: calculation
    chapter: 第2章 电阻电路等效变换
    doc: slide-05
    pages: [15, 19]
    level: 1
    question: '两个电阻 R1=6Ω、R2=3Ω。把它们串联和并联，等效电阻分别是多少？'
    answer: '串联 R=R1+R2=9Ω；并联 R=R1R2/(R1+R2)=6×3/9=2Ω。'
    points:
      - 串联 9Ω
      - 并联 2Ω
    review: 电阻串联、并联的等效公式

  - id: k-02
    type: calculation
    chapter: 第2章 电阻电路等效变换
    doc: slide-05
    pages: [15]
    level: 1
    question: 'R1=2Ω 与 R2=3Ω 串联接在 10V 直流电源上，求 R1 两端的电压。'
    answer: '总电阻 5Ω，电流 I=10/5=2A；R1 两端电压 U1=IR1=2×2=4V。'
    points:
      - 总电阻 5Ω
      - 电流 2A
      - U1=4V
    review: 串联电路分压公式

  - id: k-03
    type: calculation
    chapter: 第8章 一阶电路
    doc: slide-11
    pages: [7, 8]
    level: 2
    question: 'R=2kΩ、C=100μF 的 RC 电路，时间常数是多少？'
    answer: 'τ=RC=2000×100×10^-6=0.2s。'
    points:
      - 公式 τ=RC
      - 结果 0.2 秒
      - 单位换算正确
    review: 时间常数的计算与单位换算

  - id: k-04
    type: calculation
    chapter: 第10章 正弦稳态
    doc: slide-01
    pages: [12]
    level: 2
    question: '正弦电压 u(t)=311sin(314t)V，它的有效值约为多少？'
    answer: '有效值 U=Um/√2=311/1.414≈220V。'
    points:
      - 有效值等于最大值除以根号 2
      - 结果约 220V
    review: 正弦量最大值与有效值的关系

  - id: k-05
    type: calculation
    chapter: 第11章 正弦稳态功率
    doc: slide-03
    pages: [7, 11]
    level: 2
    question: '某感性负载 U=220V、I=5A、cosφ=0.8，求有功功率和无功功率。'
    answer: 'P=UIcosφ=220×5×0.8=880W；sinφ=0.6，Q=UIsinφ=220×5×0.6=660var。'
    points:
      - P=880W
      - Q=660var
      - 正确使用 cosφ 与 sinφ
    review: 有功功率、无功功率的计算

  - id: k-06
    type: calculation
    chapter: 第14章 频率响应
    doc: slide-16
    pages: [10, 11]
    level: 2
    question: 'L=10mH、C=100μF 的 RLC 串联电路，谐振角频率是多少？对应的谐振频率约是多少？'
    answer: 'ω0=1/√(LC)=1/√(10×10^-3×100×10^-6)=1000 rad/s；f0=ω0/(2π)≈159Hz。'
    points:
      - ω0=1/√(LC)
      - 1000 rad/s
      - 约 159Hz
    review: 谐振频率的计算

  # ---------------- 小型综合 ----------------
  - id: g-01
    type: comprehensive
    chapter: 第4章 电路定理
    doc: slide-08
    pages: [33, 34, 35, 36]
    level: 3
    question: '一个线性含源二端网络的开路电压 Uoc=12V、等效电阻 Req=4Ω。接上可变负载 RL，RL 为多少时获得最大功率？最大功率是多少？'
    answer: '由最大功率传输定理，RL=Req=4Ω；Pmax=Uoc^2/(4Req)=12^2/(4×4)=9W。'
    points:
      - RL=Req=4Ω
      - Pmax=Uoc^2/(4Req)
      - 结果 9W
    review: 戴维南等效与最大功率传输定理

  - id: g-02
    type: comprehensive
    chapter: 第8章 一阶电路
    doc: slide-11
    pages: [41, 42]
    level: 3
    question: 'RC 电路中 R=1kΩ、C=1μF，电源电压 10V，电容初始电压为 0。t=0 时接通电源，求 t=1ms 时的电容电压。'
    answer: 'τ=RC=1ms；uC(t)=10(1-e^(-t/τ))；t=1ms 时 uC=10(1-e^-1)≈6.32V。'
    points:
      - τ=1ms
      - 使用零状态响应公式
      - 结果约 6.32V
    review: 一阶电路零状态响应与三要素法

  - id: g-03
    type: comprehensive
    chapter: 第3章 电路方程
    doc: slide-06
    pages: [21, 22, 26]
    level: 3
    question: '结点 1 通过 R1=2Ω 接 10V 电压源（另一端接地），结点 1 与结点 2 之间接 R2=3Ω，结点 2 通过 R3=6Ω 接地。求两个结点电压 U1、U2。'
    answer: '结点 1 直接接电压源，U1=10V；对结点 2 列 KCL：(U2-10)/3+U2/6=0，解得 U2=20/3≈6.67V。'
    points:
      - U1=10V
      - 对结点 2 列 KCL
      - U2≈6.67V
    review: 结点电压法列写与求解

  - id: g-04
    type: comprehensive
    chapter: 第14章 频率响应
    doc: slide-16
    pages: [10, 11]
    level: 3
    question: 'RLC 串联电路 R=10Ω、L=100mH、C=100μF，接在 10V 正弦电源上并发生谐振。求谐振角频率、品质因数 Q 和电感电压。'
    answer: 'ω0=1/√(LC)=1/√(0.1×100×10^-6)≈316rad/s；Q=ω0L/R≈316×0.1/10≈3.16；谐振时 UL=QUs≈31.6V。'
    points:
      - ω0≈316rad/s
      - Q≈3.16
      - UL≈31.6V
    review: 谐振频率、品质因数与电感电压
